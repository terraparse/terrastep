[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrastep"
dynamic = ["version"]
description = "A frontmatter and status-index standard for planning documents, plus the CLI that enforces it."
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Julio Gonzalez Altamirano", email = "devjga@gmail.com"}]
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "pyyaml",
    "tomli; python_version < '3.11'",
]

[tool.setuptools.dynamic]
version = {attr = "terrastep.__version__"}

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
terrastep = "terrastep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terrastep = ["skill/**/*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terrastep"
dynamic = ["version"]
description = "A frontmatter and status-index standard for planning documents, plus the CLI that enforces it."
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Julio Gonzalez Altamirano", email = "devjga@gmail.com"}]
dependencies = [
    "pyyaml",
    "tomli; python_version < '3.11'",
]

[tool.setuptools.dynamic]
version = {attr = "terrastep.__version__"}

[project.optional-dependencies]
dev = ["pytest", "jsonschema"]

[project.scripts]
terrastep = "terrastep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terrastep = ["skill/**/*"]
